pid /tmp/omega-playground-nginx.pid;
error_log /tmp/omega-playground-edge.log;
worker_processes 1;
events { worker_connections 512; }
http {
  access_log off;
  map $http_origin $origin_host { default "!"; "" $http_host; ~^https?://(?<origin_authority>[^/]+)$ $origin_authority; }
  map $http_origin $local_origin { default "http://127.0.0.1:$omega_port"; "" ""; }
  map $http_upgrade $omega_upgrade_connection { default upgrade; "" ""; }
  server {
    listen @PUBLIC_PORT@;
    client_max_body_size 64k;
    if ($origin_host != $http_host) { return 403; }
    location = /_active {
      internal;
      proxy_pass http://127.0.0.1:18784/active;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location = /api/workflow {
      proxy_pass http://127.0.0.1:18784/switch;
    }
    location / {
      auth_request /_active;
      auth_request_set $omega_port $upstream_http_x_omega_port;
      proxy_pass http://127.0.0.1:$omega_port;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:$omega_port;
      proxy_set_header Origin $local_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $omega_upgrade_connection;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
